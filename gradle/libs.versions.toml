stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
[plugins]
android-library = { id = "com.android.library", version.ref = "android-gradle" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
gradle-publish = { id = "com.gradle.plugin-publish", version = "2.1.1" }
central-portal-plus = { id = "cn.lalaki.central", version.ref = "central-portal-plus" }
detekt = { id = "dev.detekt", version.ref="detekt" }