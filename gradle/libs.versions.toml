[versions]
android-gradle = "9.4.0"
central-portal-plus = "3.0.3"
#noinspection UnusedVersionCatalogEntry
central-portal-plus-last = "3.0.3"
commons-compress2 = "1.28.0"
commons-io = "2.22.0"
detekt = "2.0.0-alpha.6"
detekt-formatting = "1.23.8"
gradle-publish = "2.2.1"
gson = "2.14.0"
kotlin = "2.4.20"
okhttp = "5.5.0"

[libraries]
commons-compress2 = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress2" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt-formatting" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }

[plugins]
android-library = { id = "com.android.library", version.ref = "android-gradle" }
central-portal-plus = { id = "cn.lalaki.central", version.ref = "central-portal-plus" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
gradle-publish = { id = "com.gradle.plugin-publish", version.ref = "gradle-publish" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
